# Config per il dominio lead.fbosolution.it (Let's Encrypt).
# Stesso pattern di fbomailer: dominio pubblico su 443 + API interna
# utenti esposta SOLO su loopback (127.0.0.1:8451) per il Portale.
server {
    listen 443 ssl;
    server_name lead.fbosolution.it;

    ssl_certificate     /etc/letsencrypt/live/lead.fbosolution.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lead.fbosolution.it/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/fboleads/app/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/fboleads/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# API interna di gestione utenti: solo loopback (usata dal Portale).
server {
    listen 127.0.0.1:8451 ssl;
    server_name 127.0.0.1;

    ssl_certificate     /etc/letsencrypt/live/lead.fbosolution.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lead.fbosolution.it/privkey.pem;

    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/fboleads/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
