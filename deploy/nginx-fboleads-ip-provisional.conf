# Config provvisoria in uso finché non esiste un dominio per FBOLeads.
# Il VPS serve su IP nudo: Portale :8443, Collaudi :8444, Preventivi :8445,
# RackReport :8446, NetVault :8447, Squadfy :8448 — FBOLeads usa la 8451
# (prima porta libera). Da sostituire con un dominio + Let's Encrypt.
server {
    listen 8451 ssl;
    server_name 94.177.161.127;

    ssl_certificate     /etc/ssl/fboleads/selfsigned.crt;
    ssl_certificate_key /etc/ssl/fboleads/selfsigned.key;

    client_max_body_size 10M;

    # API interna di gestione utenti: solo loopback (usata dal Portale).
    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/fboleads/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /opt/fboleads/app/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/fboleads/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
